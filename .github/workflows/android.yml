name: Build APK

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      MESHGEN_BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      # Optional: a private release key stored in repo secrets (see README "Release signing").
      # Without it, release APKs are signed with the public test key in /signing.
      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "MESHGEN_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "Using private release key."
          else
            echo "::notice::No KEYSTORE_BASE64 secret set; release APK is signed with the public test key."
          fi

      - name: Unit tests
        run: ./gradlew testDebugUnitTest

      - name: Build debug and release APKs
        env:
          MESHGEN_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          MESHGEN_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          MESHGEN_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleDebug assembleRelease

      - name: Rename APKs
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/MeshGen-0.0.${MESHGEN_BUILD_NUMBER}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "dist/MeshGen-0.0.${MESHGEN_BUILD_NUMBER}-debug.apk"
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: MeshGen-0.0.${{ github.run_number }}
          path: dist/*.apk

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: app/build/reports/tests/

      # main → a permanent numbered release, marked "Latest".
      - name: Publish release (main)
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v0.0.${MESHGEN_BUILD_NUMBER}" dist/*.apk \
            --target "$GITHUB_SHA" \
            --title "MeshGen 0.0.${MESHGEN_BUILD_NUMBER}" \
            --notes "Built from ${GITHUB_SHA::7}. Install MeshGen-0.0.${MESHGEN_BUILD_NUMBER}.apk on your phone." \
            --latest

      # Other branches → one rolling pre-release called "dev-build", replaced on every push.
      - name: Publish dev build (other branches)
        if: github.event_name == 'push' && github.ref != 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete dev-build --cleanup-tag --yes || true
          gh release create dev-build dist/*.apk \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "Dev build 0.0.${MESHGEN_BUILD_NUMBER} (${GITHUB_REF_NAME})" \
            --notes "Preview from branch ${GITHUB_REF_NAME} at ${GITHUB_SHA::7}. Not merged to main yet."
